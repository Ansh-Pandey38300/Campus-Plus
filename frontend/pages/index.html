<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Plus</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <h1>Campus Plus</h1>
  <p>Post what you need. Sellers compete with lower prices.</p>
  <div class="card">
    <h2>Setup check</h2>
    <button id="check">Check API and database</button>
    <p id="result">Not checked yet.</p>
  </div>
  <script>
    document.getElementById('check').addEventListener('click', async () => {
      const out = document.getElementById('result');
      try {
        const api = await (await fetch('/api/hello')).json();
        const db = await (await fetch('/api/health/db')).json();
        out.textContent = 'API: ' + api.message + ' | Database: ' + db.db;
      } catch (e) {
        out.textContent = 'Could not reach the server. Is it running?';
      }
    });
  </script>
</body>
</html>
